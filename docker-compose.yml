services:
  religion-novel:
    image: caddy:2-alpine
    container_name: religion-novel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8101"
      - "127.0.0.1:8102:8102"
    volumes:
      - ./site:/srv:ro
      - ./author-site:/author:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8101/data/project.json && wget -q -O /dev/null http://127.0.0.1:8102/data/project.json"]
      interval: 30s
      timeout: 5s
      retries: 3
